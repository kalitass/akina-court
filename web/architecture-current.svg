<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Akina Court current prototype architecture</title>
  <desc id="desc">Synthetic trip evidence passes through deterministic facts and policy code, two advocates and a judge, then a verification gate. Outputs are proposed actions, notices, receipts, and human review. The prototype does not transfer money.</desc>
  <defs>
    <style>
      .bg{fill:#0b101b}.panel{fill:#151e2d;stroke:#34445b;stroke-width:2}.code{stroke:#4baad8}.agent{stroke:#a78bfa}.out{stroke:#5ee0b5}.head{font:700 48px system-ui,sans-serif;fill:#f3f7fc}.sub{font:24px system-ui,sans-serif;fill:#a8b8ce}.label{font:700 28px system-ui,sans-serif;fill:#f3f7fc}.body{font:22px system-ui,sans-serif;fill:#c6d4e4}.small{font:19px system-ui,sans-serif;fill:#93a9c4}.arrow{stroke:#728aa7;stroke-width:5;fill:none;marker-end:url(#tip)}
    </style>
    <marker id="tip" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#728aa7"/></marker>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <text class="head" x="80" y="100">Akina Court</text>
  <text class="sub" x="80" y="145">Current prototype: evidence, debate, verification, human hand-off</text>
  <rect class="panel" x="75" y="215" width="300" height="335" rx="22"/>
  <text class="label" x="105" y="265">Case evidence</text>
  <text class="body" x="105" y="320">Synthetic trips and GPS</text>
  <text class="body" x="105" y="360">Fares and messages</text>
  <text class="body" x="105" y="400">Route and traffic facts</text>
  <text class="small" x="105" y="470">Sample history windows</text>
  <text class="small" x="105" y="498">may be unknown</text>
  <path class="arrow" d="M380 385 H438"/>
  <rect class="panel code" x="455" y="215" width="315" height="335" rx="22"/>
  <text class="label" x="485" y="265">Deterministic code</text>
  <text class="body" x="485" y="320">Numbered fact table</text>
  <text class="body" x="485" y="360">Sourced policy clauses</text>
  <text class="body" x="485" y="400">Eligibility certificate</text>
  <text class="small" x="485" y="470">Unclear or safety cases</text>
  <text class="small" x="485" y="498">are marked for a person</text>
  <path class="arrow" d="M775 385 H833"/>
  <rect class="panel agent" x="850" y="215" width="315" height="335" rx="22"/>
  <text class="label" x="880" y="265">Three AI agents</text>
  <text class="body" x="880" y="320">Rider advocate</text>
  <text class="body" x="880" y="360">Driver advocate</text>
  <text class="body" x="880" y="400">Judge</text>
  <text class="small" x="880" y="470">Logged evidence reads,</text>
  <text class="small" x="880" y="498">briefs and rebuttals</text>
  <path class="arrow" d="M1170 385 H1228"/>
  <rect class="panel code" x="1245" y="215" width="280" height="335" rx="22"/>
  <text class="label" x="1275" y="265">Code verification</text>
  <text class="body" x="1275" y="320">Check citations</text>
  <text class="body" x="1275" y="360">Check outcome</text>
  <text class="body" x="1275" y="400">Check amount</text>
  <text class="small" x="1275" y="470">Fail closed or refer</text>
  <text class="small" x="1275" y="498">for human review</text>
  <path class="arrow" d="M1385 555 V610"/>
  <rect class="panel out" x="75" y="625" width="1450" height="175" rx="22"/>
  <text class="label" x="105" y="678">Reviewable outputs</text>
  <text class="body" x="105" y="727">Proposed actions  ·  deterministic notices  ·  event log and receipt  ·  human review queue</text>
  <text class="small" x="105" y="767">No payment, voucher or account action is executed by this prototype.</text>
</svg>
