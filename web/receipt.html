<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Akina Court · Receipt</title>
<meta name="description" content="Reproducibility receipt for one ruling: what it rests on, whether it can be reproduced today, and how the policy decided it.">
<link rel="icon" href="/logo.svg">
<script src="/theme.js"></script>
<link rel="stylesheet" href="/styles/base.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:980px;margin:0 auto;padding:0 20px 48px}
header{padding:26px 0 6px;display:flex;align-items:center;gap:12px}
.logo{width:34px;height:34px;border-radius:9px;display:block}
header .t{font-weight:700;font-size:15px}header .s{font-size:12px;color:var(--muted);white-space:nowrap}
header nav{margin-left:auto;display:flex;gap:14px;font-size:12.5px;font-weight:600;white-space:nowrap}
header nav a{color:var(--blue);text-decoration:none}
h1{font-size:clamp(26px,4vw,38px);line-height:1.1;letter-spacing:-.02em;margin:26px 0 6px}
.lead{color:var(--ink2);font-size:16px;margin:0 0 18px}
.q{color:var(--ink2);font-style:italic;margin:0 0 20px;padding-left:12px;border-left:3px solid var(--line)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px 14px;margin-bottom:14px}
.card h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:700}
.verdict{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.verdict .out{font-size:26px;font-weight:800;letter-spacing:-.02em}
.verdict .amt{font:700 26px var(--mono)}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font:700 11.5px var(--mono);border:1px solid;white-space:nowrap}
.badge.green{color:var(--green);border-color:rgba(58,210,159,.5);background:rgba(58,210,159,.1)}
.badge.amber{color:var(--amber);border-color:rgba(245,181,68,.5);background:rgba(245,181,68,.1)}
.badge.red{color:var(--red);border-color:rgba(255,92,92,.5);background:rgba(255,92,92,.1)}
.badge.grey{color:var(--muted);border-color:var(--line);background:var(--panel2)}
.act{margin-top:10px;color:var(--ink2)}
.status{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:12px;border:1px solid;margin-bottom:12px}
.status .ic{font-size:22px;line-height:1}
.status b{display:block;font-size:15px}
.status p{margin:2px 0 0;color:var(--ink2);font-size:13.5px}
.status.ok{border-color:rgba(58,210,159,.45);background:rgba(58,210,159,.08)}
.status.bad{border-color:rgba(255,92,92,.45);background:rgba(255,92,92,.08)}
.status.none{border-color:var(--line);background:var(--panel2)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.k{font-weight:600;width:150px}
td.h{font:12.5px var(--mono);color:var(--ink2)}
td.m{width:110px;white-space:nowrap}
.trace{list-style:none;margin:0;padding:0}
.trace li{display:grid;grid-template-columns:22px 92px 1fr;gap:8px 10px;padding:9px 0;border-bottom:1px solid var(--line);align-items:start}
.trace li:last-child{border-bottom:0}
.trace .ic{font-weight:800;text-align:center}
.trace li.ok .ic{color:var(--green)}.trace li.bad .ic{color:var(--red)}.trace li.open .ic{color:var(--amber)}
.trace .rule{font-weight:600}
.trace .obs{display:block;color:var(--ink2);font-size:13px;margin-top:2px}
.trace .obs::before{content:"In this case: ";color:var(--muted)}
.trace li.sum{grid-template-columns:22px 1fr;color:var(--ink2)}
.cid{font:700 11.5px var(--mono);color:var(--blue);text-decoration:none;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:2px 6px;display:inline-block;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:600 11.5px var(--mono);color:var(--ink2);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:2px 7px;text-decoration:none}
.chip:hover,.cid:hover{border-color:var(--blue);color:var(--ink)}
.wwc{margin:0;padding-left:18px;color:var(--ink2)}
.wwc li{margin:4px 0}
.meta{color:var(--muted);font-size:12.5px;margin-top:18px}
.meta a{color:var(--blue);text-decoration:none}
.small{font-size:13px;color:var(--muted);margin:8px 0 0}
.err{padding:16px;border:1px solid rgba(255,92,92,.45);border-radius:12px;color:var(--red)}
@media(max-width:620px){header nav{display:none}.trace li{grid-template-columns:22px 1fr}.trace .cid{grid-column:2}td.k{width:auto}}
</style>
</head>
<body>
<div class="wrap">
<header><a href="/" aria-label="Akina Court home"><img class="logo" src="/logo.svg" alt=""></a><div><div class="t">Akina Court</div><div class="s">Ryde Dispute Court · reproducibility receipt</div></div>
  <nav><a id="navReplay" href="/replay.html">Replay this case</a><a href="/ops.html">Ops handoff</a><a href="/policy.html">Policy</a><a href="/report.html">Full results</a></nav></header>
<main id="main"><p class="lead">Loading the receipt…</p></main>
</div>
<script>
(async function(){
  const Q = new URLSearchParams(location.search), RUN = Q.get('run') || Q.get('case') || 'C-0001', CASE = RUN.split('~')[0];
  const main = document.getElementById('main');
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const OUT = { refund_partial:'Partial refund', refund_full:'Full refund', no_action:'No refund', fee_waived:'Fee waived', escalate:'Sent to a human reviewer' };
  const TYPE = { route_deviation:'Route deviation', no_show:'No-show fee', safety:'Safety' };
  const KEYS = [['case_sha256','Case file','the trip, GPS, chat, fare and profiles the ruling was made on'],['policy_sha256','Policy text','policy/policy.md, every clause the judge may cite'],['code_sha256','Court code','core/: fact engine, policy engine, agents, checks'],['model','Model','the model id the agents were run with']];
  document.getElementById('navReplay').href = `/replay.html?case=${encodeURIComponent(CASE)}${RUN !== CASE ? '&run=' + encodeURIComponent(RUN) : ''}&phase=court`;
  let r, run;
  try {
    const [a, b] = await Promise.all([fetch(`/api/runs/${encodeURIComponent(RUN)}/receipt`), fetch(`/api/runs/${encodeURIComponent(RUN)}`)]);
    if (!a.ok) throw new Error(`no receipt for ${RUN} (${a.status})`);
    r = await a.json(); run = b.ok ? await b.json() : null;
  } catch (e) { main.innerHTML = `<div class="err">${esc(e.message)}</div>`; return; }
  const ru = r.ruling || {}, el = r.eligibility || {}, d = (run && run.dispute) || r.dispute || {};
  const human = ru.escalate || ru.ruling === 'escalate' || el.auto === false;
  const amt = ru.amount != null ? '$' + (+ru.amount).toFixed(2) : '';
  const actions = (el.actions || []).map(a => `<span class="badge ${a.mode === 'auto' ? 'green' : 'amber'}">${esc((a.type || '').replace(/_/g, ' '))} · ${a.mode === 'auto' ? 'auto-cleared' : 'a person decides'}</span>`).join(' ');
  // fingerprints
  const stored = r.stored, cur = r.current || {}, match = r.match || {};
  const short = v => v == null ? '—' : String(v).length > 20 ? String(v).slice(0, 16) + '…' : String(v);
  let status;
  if (stored && r.verified) status = `<div class="status ok"><span class="ic">✓</span><div><b>Reproducible today</b><p>${esc(r.status)}. Running the same case through the same policy, code and model would be checked against exactly these fingerprints.</p></div></div>`;
  else if (stored) status = `<div class="status bad"><span class="ic">⚠</span><div><b>Something changed since this ruling</b><p>${esc(r.status)}. The rows marked ✗ differ from what was fixed at ruling time; re-run the case before relying on it.</p></div></div>`;
  else status = `<div class="status none"><span class="ic">○</span><div><b>No fingerprints were stored with this run</b><p>It was recorded before receipts were introduced, so there is nothing to compare against. The fingerprints below are what a re-run today would be sealed with.</p></div></div>`;
  const rows = KEYS.map(([k, label, what]) => `<tr><td class="k">${label}<div class="small" style="margin:0;font-weight:400">${what}</div></td><td class="h">${stored ? esc(short(stored[k])) : '—'}</td><td class="h">${esc(short(cur[k]))}</td><td class="m">${stored ? (match[k] ? '<span class="badge green">✓ same</span>' : '<span class="badge red">✗ changed</span>') : '<span class="badge grey">not stored</span>'}</td></tr>`).join('');
  // policy trace
  const lines = r.certificate || [];
  const trace = lines.map(l => {
    const m = l.match(/^([✓✗?])\s+([A-Z]+-\d+(?:\s*\([a-z]+\))?)\s+(.*)$/);
    if (!m) { const pretty = l.replace(/^allowed outcomes:/, 'Allowed outcomes:').replace(/flag_account required: (True|False)/, (x, v) => 'Account flag required: ' + (v === 'True' ? 'yes' : 'no')).replace(/\b(refund_partial|refund_full|no_action|fee_waived|escalate)\b/g, k => OUT[k].toLowerCase()); return `<li class="sum"><span class="ic">·</span><span>${esc(pretty)}</span></li>`; }
    const cls = m[1] === '✓' ? 'ok' : m[1] === '✗' ? 'bad' : 'open';
    const [rule, obs] = m[3].split(/\s*\[case\]\s*/);
    const cid = m[2].replace(/\s*\(.*$/, '');
    return `<li class="${cls}"><span class="ic">${m[1]}</span><a class="cid" href="/policy.html#${esc(cid)}" target="_blank" rel="noopener">${esc(m[2])}</a><span><span class="rule">${esc(rule)}</span>${obs ? `<span class="obs">${esc(obs)}</span>` : ''}</span></li>`;
  }).join('');
  const wwc = (el.what_would_change || []).map(x => `<li>${esc(x)}</li>`).join('');
  const facts = (ru.cited_facts || []).map(f => `<a class="chip" href="/replay.html?case=${encodeURIComponent(CASE)}&mode=expert&phase=court" title="open the fact table">${esc(f)}</a>`).join('');
  const clauses = (ru.cited_policy || []).map(c => `<a class="chip" href="/policy.html#${esc(c.replace(/\(.*$/, ''))}" target="_blank" rel="noopener">${esc(c)}</a>`).join('');
  document.title = `Akina Court · Audit record ${RUN}`;
  main.innerHTML = `
  <h1>Audit record for this ruling</h1>
  <p class="small" style="margin:-2px 0 6px;font-family:var(--mono)">${esc(RUN)}</p>
  <p class="lead">${esc(TYPE[d.type] || d.type || 'Dispute')}${d.filed_by ? ' · filed by the ' + esc(d.filed_by) : ''}${r.issued_at ? ' · ruled ' + esc(String(r.issued_at).replace('T', ' ').slice(0, 16)) + ' UTC' : ''}</p>
  ${d.statement ? `<p class="q">“${esc(d.statement)}”</p>` : ''}
  <div class="card"><h2>Outcome</h2><div class="verdict"><span class="out">${esc(OUT[ru.ruling] || ru.ruling || '')}</span>${amt ? `<span class="amt">${amt}</span>` : ''}<span class="badge ${human ? 'amber' : 'green'}">${human ? '👤 a person decides' : '⚡ cleared by the policy check'}</span></div>
    ${actions ? `<div class="act"><div class="chips">${actions}</div></div>` : ''}
    ${ru.recommended_action ? `<div class="act">${esc(ru.recommended_action)}</div>` : ''}</div>
  <div class="card"><h2>Can this ruling be reproduced?</h2>${status}
    <details><summary class="small" style="cursor:pointer;color:var(--blue)">Technical fingerprints</summary><table style="margin-top:8px"><tr><th>What</th><th>Sealed at ruling time</th><th>Now</th><th></th></tr>${rows}</table>
    <p class="small">Fingerprints are SHA-256 hashes, shortened. Model: <span style="font-family:var(--mono)">${esc(r.model || cur.model || '')}</span>.</p></details></div>
  <div class="card"><h2>How the policy decided it</h2><ul class="trace">${trace || '<li class="sum"><span class="ic">·</span><span>No policy trace stored for this run.</span></li>'}</ul></div>
  ${wwc ? `<div class="card"><h2>What would change this ruling</h2><ul class="wwc">${wwc}</ul></div>` : ''}
  <div class="card"><h2>On the record</h2>
    <p class="small" style="margin:0 0 6px">Facts the ruling cites (${(ru.cited_facts || []).length} of ${(r.fact_ids || []).length} computed):</p><div class="chips">${facts || '—'}</div>
    <p class="small" style="margin:10px 0 6px">Clauses the ruling cites:</p><div class="chips">${clauses || '—'}</div></div>
  <p class="meta">${esc(r.appeal || '')}</p>
  <p class="meta"><a href="${esc(document.getElementById('navReplay').href)}">Watch the court on this case →</a></p>`;
})();
</script>
</body>
</html>
