  <path d="M6 60 C 20 60, 28 54, 20 48 C 12 42, 24 38, 33 40 C 44 42, 46 36, 38 33" fill="none" stroke="#0f1522" stroke-width="7" stroke-linecap="round"/>
  <path d="M6 60 C 20 60, 28 54, 20 48 C 12 42, 24 38, 33 40 C 44 42, 46 36, 38 33" fill="none" stroke="#3ad29f" stroke-width="4" stroke-linecap="round"/>
  <!-- the pass -->
