<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Akina Court logo: a mountain pass with a hairpin road">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22304a"/><stop offset="1" stop-color="#0f1522"/></linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#sky)"/>
  <!-- ridge line -->
  <path d="M4 52 L22 18 L33 34 L41 24 L60 52 Z" fill="#3c4d6b"/>
  <path d="M4 52 L22 18 L33 34 L41 24 L60 52" fill="none" stroke="#6f83a6" stroke-width="1.6" stroke-linejoin="round"/>
